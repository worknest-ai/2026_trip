<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>포항→속초 4박5일 동해안 드라이브 · PC 전용 (2026.11.2~11.6)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* 1차 CDN이 막힌 환경(사내망·기내·일부 모바일망)에서는 2차 CDN으로 재시도 */
if(typeof L === 'undefined'){
  document.write('<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">');
  document.write('<scr'+'ipt src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/scr'+'ipt>');
}
</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { min-width:1180px; height:100%; font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif; background:#0e1420; color:#e8ecf2; overflow:hidden; }
  #map { position:absolute; inset:0; z-index:1; }

  /* 상단 영역 : 데스크톱에선 각자 절대배치, 모바일에선 하나의 상단 바 */
  .topbar { display:contents; }
  .brand { position:absolute; top:16px; left:16px; z-index:1000; font-size:13px; color:#8b96ab; letter-spacing:.3px; }
  .brand b { color:#e8ecf2; font-size:15px; }
  .brand i { font-style:normal; }
  .brand i::before { content:' · '; }

  /* 일차 탭 */
  .tabs { position:absolute; top:44px; left:16px; z-index:1000; display:flex; gap:8px; flex-wrap:wrap; max-width:calc(100% - 460px); }
  .tab { background:#1b2333; color:#cfd6e2; border:1px solid #2c3850; border-radius:24px; padding:8px 15px; font-size:14px; font-weight:bold; cursor:pointer; transition:.15s; }
  .tab:hover { background:#26314a; }
  .tab.on { background:#fff; color:#111; border-color:#fff; }
  .tab small { display:block; font-size:10px; font-weight:normal; opacity:.7; }
  .tab.all { background:linear-gradient(90deg,#5b8def,#2ecc9a,#f39c3d,#b57bee,#e8734a); color:#fff; border-color:transparent; }
  .tab.all.on { box-shadow:0 0 0 2.5px #fff; color:#fff; }

  /* 레이어 토글 + 범례 */
  .layers { position:absolute; left:16px; bottom:16px; z-index:1000; background:rgba(16,22,34,.94); border:1px solid #253048;
    border-radius:12px; padding:10px 12px; font-size:11.5px; color:#aeb8c9; width:196px; }
  .layers h4 { font-size:10.5px; color:#7f8ba1; letter-spacing:.8px; margin-bottom:7px; font-weight:bold; }
  .lrow { display:flex; align-items:center; gap:8px; padding:4px 6px; border-radius:7px; cursor:pointer; user-select:none; transition:.12s; }
  .lrow:hover { background:#1c2437; }
  .lrow .sw { width:19px; height:19px; min-width:19px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10.5px; border:2px solid #fff; }
  .lrow .lb { flex:1; color:#cfd6e2; font-weight:bold; }
  .lrow .ck { width:15px; height:15px; border-radius:4px; border:1.5px solid #3a4a68; display:flex; align-items:center; justify-content:center; font-size:10px; color:#0e1420; }
  .lrow.off { opacity:.4; }
  .lrow.on .ck { background:#5b8def; border-color:#5b8def; }
  .ldiv { border-top:1px solid #202b40; margin:8px 0 6px; padding-top:7px; }
  .ldays { display:flex; flex-wrap:wrap; gap:5px 9px; font-size:10.5px; }
  .ldays span i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; vertical-align:0px; }

  /* 우측 패널 */
  .panel { position:absolute; top:16px; right:16px; bottom:16px; width:420px; max-width:calc(100% - 32px);
    background:#141b29; border:1px solid #253048; border-radius:16px; z-index:1000;
    display:flex; flex-direction:column; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,.5); }
  .panel-head { padding:16px 18px 0; border-bottom:1px solid #202b40; }
  .p-day { font-size:12.5px; color:#9aa6ba; }
  .p-title { font-size:19px; font-weight:800; line-height:1.35; margin:3px 0 6px; }
  .p-sub { font-size:12.5px; color:#aeb8c9; line-height:1.5; margin-bottom:10px; }
  .p-meta { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .chip { font-size:11px; background:#1b2333; border:1px solid #2c3850; border-radius:7px; padding:3px 8px; color:#9fb0c8; }
  .subtabs { display:flex; gap:4px; }
  .stab { flex:1; background:none; border:none; border-bottom:2px solid transparent; color:#8b96ab; font-size:12.5px;
    font-weight:bold; padding:9px 2px; cursor:pointer; font-family:inherit; }
  .stab:hover { color:#cfd6e2; }
  .stab.on { color:#fff; border-bottom-color:#5b8def; }

  .panel-scroll { overflow-y:auto; padding:16px 18px 22px; flex:1; }
  .panel-scroll::-webkit-scrollbar { width:8px; }
  .panel-scroll::-webkit-scrollbar-thumb { background:#2c3850; border-radius:4px; }

  .route-btn { display:inline-flex; align-items:center; gap:7px; background:#fff; color:#111; border:none;
    border-radius:9px; padding:8px 14px; font-size:13px; font-weight:bold; cursor:pointer; text-decoration:none; margin-bottom:14px; }
  .route-btn:hover { background:#e8ecf2; }
  .sect { font-size:12px; font-weight:bold; color:#7f8ba1; letter-spacing:1px; margin:16px 0 8px; text-transform:uppercase; }
  .card { display:flex; gap:11px; background:#1b2333; border:1px solid #253048; border-radius:12px; padding:11px; margin-bottom:9px; cursor:pointer; transition:.15s; }
  .card:hover, .card.hl { border-color:#5b8def; background:#20293e; }
  .card.roadcard { background:#16202f; border-style:dashed; }
  .card .ic { width:46px; height:46px; min-width:46px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:23px; background:#26314a; }
  .card .t { font-size:11.5px; color:#9aa6ba; }
  .card .nm { font-size:14px; font-weight:bold; margin:1px 0 3px; line-height:1.35; }
  .card .nm .num { display:inline-flex; align-items:center; justify-content:center; width:17px; height:17px; border-radius:50%; background:#5b8def; color:#fff; font-size:10.5px; margin-right:5px; vertical-align:1px; }
  .card .ds { font-size:12px; color:#aeb8c9; line-height:1.5; }
  .card .ad { font-size:11px; color:#7f8ba1; margin-top:4px; }
  .badge { display:inline-block; font-size:10.5px; padding:1px 7px; border-radius:9px; margin-left:4px; vertical-align:1px; font-weight:normal; }
  .b-must { background:#3d2430; color:#ff8fa3; } .b-food { background:#3a2f1c; color:#ffd166; }
  .b-inland { background:#1d3326; color:#7ed9a0; } .b-night { background:#2a2440; color:#c3b1ff; }
  .b-road { background:#16324a; color:#6ec6ff; } .b-photo { background:#3b2340; color:#f19bff; }
  .b-new { background:#123a34; color:#5fe0c0; }
  .tag { display:inline-block; font-size:10.5px; background:#222c42; color:#9fb0c8; border-radius:6px; padding:1px 7px; margin:4px 4px 0 0; }
  .stay-note { background:#1a2438; border-left:3px solid #5b8def; border-radius:0 10px 10px 0; padding:10px 13px; margin-top:12px; font-size:12.5px; color:#cfd6e2; line-height:1.55; }
  .drivebar { font-size:12px; color:#9aa6ba; background:#161d2c; border:1px solid #202b40; border-radius:9px; padding:9px 12px; margin-top:12px; line-height:1.6; }
  .warn { font-size:12px; color:#ffc9a3; background:#2a1e17; border:1px solid #4a3325; border-radius:9px; padding:9px 12px; margin-bottom:12px; line-height:1.6; }

  /* 마커 */
  .mk { display:flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:50%;
    color:#fff; font-weight:800; font-size:13px; border:2.5px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.6); }
  .mk.inland-mk { border-color:#7ed9a0; }
  .mk.poi { width:26px; height:26px; font-size:14px; border-width:2px; }
  .mk.dot { width:13px; height:13px; border-width:1.5px; }
  /* 아이콘 핀 (포토존·맛집·드론·숙박) */
  .pin { width:27px; height:27px; border-radius:50% 50% 50% 3px; transform:rotate(-45deg);
    border:2px solid #fff; box-shadow:0 3px 7px rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; }
  .pin b { transform:rotate(45deg); font-size:13px; line-height:1; font-weight:normal; }
  .pin.sm { width:22px; height:22px; } .pin.sm b { font-size:11px; }
  .mk-label { background:rgba(10,14,22,.85); color:#fff; border:none; border-radius:6px; padding:2px 8px; font-size:11.5px; font-weight:bold; box-shadow:none; white-space:nowrap; }
  .mk-label.tiny { font-size:10.5px; padding:1px 6px; background:rgba(10,14,22,.75); }
  .leaflet-tooltip-top.mk-label::before { border-top-color:rgba(10,14,22,.85); }

  /* 전체보기 패널 */
  .daycard { display:flex; gap:11px; align-items:flex-start; background:#1b2333; border:1px solid #253048; border-left:4px solid #5b8def;
    border-radius:10px; padding:11px 12px; margin-bottom:9px; cursor:pointer; transition:.15s; }
  .daycard:hover { background:#20293e; border-color:#5b8def; }
  .daycard .dn { font-size:11.5px; color:#9aa6ba; }
  .daycard .dt { font-size:13.5px; font-weight:bold; margin:2px 0 4px; line-height:1.35; }
  .daycard .dm { font-size:11px; color:#8b96ab; line-height:1.6; }
  .daycard .go { font-size:11px; color:#6ec6ff; margin-top:5px; }
  .sumgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-bottom:14px; }
  .sumbox { background:#1b2333; border:1px solid #253048; border-radius:10px; padding:9px 6px; text-align:center; }
  .sumbox .v { font-size:17px; font-weight:800; }
  .sumbox .k { font-size:10.5px; color:#8b96ab; margin-top:2px; }

  /* ===== 상세 정보 레이어(모달) ===== */
  .modal { position:fixed; inset:0; z-index:3000; background:rgba(6,9,16,.72); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; padding:24px; }
  .modal.open { display:flex; animation:fade .18s ease; }
  @keyframes fade { from{opacity:0} to{opacity:1} }
  .msheet { width:520px; max-width:100%; max-height:86vh; background:#141b29; border:1px solid #2c3850; border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.7); display:flex; flex-direction:column; overflow:hidden; animation:pop .22s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes pop { from{transform:translateY(14px) scale(.97);opacity:0} to{transform:none;opacity:1} }
  .mhead { display:flex; gap:13px; align-items:flex-start; padding:20px 20px 16px; border-bottom:1px solid #202b40; }
  .m-ic { width:54px; height:54px; min-width:54px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:27px; }
  .m-kind { font-size:12px; color:#9aa6ba; font-weight:bold; }
  .m-title { font-size:21px; font-weight:800; line-height:1.3; margin-top:3px; }
  .mclose { margin-left:auto; background:#1b2333; border:1px solid #2c3850; color:#9aa6ba; width:30px; height:30px;
    min-width:30px; border-radius:9px; font-size:16px; cursor:pointer; line-height:1; }
  .mclose:hover { background:#26314a; color:#fff; }
  .m-body { padding:18px 20px; overflow-y:auto; flex:1; }
  .m-body::-webkit-scrollbar { width:8px; }
  .m-body::-webkit-scrollbar-thumb { background:#2c3850; border-radius:4px; }
  .m-photo { position:relative; height:250px; margin:-18px -20px 18px; overflow:hidden; background:linear-gradient(135deg,#1f2c43,#0f1624); }
  .m-photo::after { content:''; position:absolute; inset:auto 0 0; height:45%; background:linear-gradient(transparent,rgba(7,10,17,.84)); pointer-events:none; }
  .m-photo img { display:block; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .28s ease; }
  .m-photo.ready img { opacity:1; }
  .m-photo-status { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:8px; color:#aeb8c9; font-size:12px; }
  .m-photo.ready .m-photo-status { display:none; }
  .m-photo-credit { position:absolute; z-index:1; left:14px; right:14px; bottom:10px; color:#dce4f0; font-size:10.5px; line-height:1.4; text-shadow:0 1px 4px #000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .m-photo-credit a { color:#fff; text-decoration:none; border-bottom:1px solid rgba(255,255,255,.5); }
  .mds { font-size:14px; line-height:1.72; color:#dbe2ec; }
  .mtable { margin-top:14px; border:1px solid #202b40; border-radius:11px; overflow:hidden; }
  .mrow { display:flex; gap:10px; padding:9px 13px; font-size:12.5px; color:#cfd6e2; border-bottom:1px solid #1b2333; }
  .mrow:last-child { border-bottom:none; }
  .mrow .mk2 { width:52px; min-width:52px; color:#7f8ba1; font-weight:bold; }
  .mnote { margin-top:12px; font-size:12.5px; line-height:1.65; color:#aeb8c9; background:#161d2c;
    border:1px solid #202b40; border-radius:10px; padding:11px 13px; }
  .mfoot { display:flex; gap:8px; padding:14px 20px 18px; border-top:1px solid #202b40; }
  .mbtn { flex:1; text-align:center; text-decoration:none; font-size:12.5px; font-weight:bold; padding:10px 6px;
    border-radius:10px; background:#1b2333; border:1px solid #2c3850; color:#cfd6e2; }
  .mbtn:hover { background:#26314a; color:#fff; }
  .mbtn.pri { background:#fff; color:#111; border-color:#fff; }
  .mbtn.pri:hover { background:#e8ecf2; color:#111; }

  /* 모바일 시트 손잡이 (데스크톱에선 숨김) */
  .grab { display:none; }
  @keyframes slideup { from{ transform:translateY(100%); } to{ transform:none; } }

  /* 지도 로드 실패 시 */
  .nomap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; color:#8b96ab; gap:6px; }
  .nomap .nm-ic { font-size:42px; opacity:.5; }
  .nomap b { color:#e8ecf2; font-size:15px; }
  .nomap p { font-size:12.5px; line-height:1.7; }
  body.nomap-mode .panel { top:auto; height:74vh; }
  @media (max-width:1px){ body.nomap-mode .panel { height:72vh; height:72dvh; } }

  /* ===================== 모바일 반응형 ===================== */
  @media (max-width:1px) {
    html, body { -webkit-text-size-adjust:100%; overscroll-behavior:none; }

    /* --- 상단 바 : 브랜드 + 일차 탭 + 레이어 칩을 하나의 흐름으로 --- */
    .topbar { display:block; position:fixed; top:0; left:0; right:0; z-index:1200;
      padding:calc(env(safe-area-inset-top, 0px) + 9px) 0 10px;
      background:linear-gradient(180deg, rgba(14,20,32,.97) 55%, rgba(14,20,32,.75) 82%, rgba(14,20,32,0));
      pointer-events:none; }
    .topbar > * { pointer-events:auto; }

    .brand { position:static; padding:0 12px 7px; font-size:10.5px; line-height:1.3; }
    .brand b { font-size:13.5px; display:block; }
    .brand i { display:block; }
    .brand i::before { content:''; }

    .tabs { position:static; max-width:none; padding:0 12px 7px; gap:6px;
      flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    .tabs::-webkit-scrollbar { display:none; }
    .tab { flex:0 0 auto; padding:7px 13px; font-size:13px; }
    .tab small { font-size:9.5px; }

    .layers { position:static; width:auto; background:none; border:none; border-radius:0; padding:0 12px; }
    .layers h4, .ldiv, .ldays { display:none; }
    #layerRows { display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    #layerRows::-webkit-scrollbar { display:none; }
    .lrow { flex:0 0 auto; background:rgba(20,27,41,.96); border:1px solid #2c3850; border-radius:20px;
      padding:6px 12px 6px 7px; gap:6px; }
    .lrow.on { border-color:#5b8def; background:rgba(30,44,72,.96); }
    .lrow.off { opacity:.55; }
    .lrow .ck { display:none; }
    .lrow .sw { width:18px; height:18px; min-width:18px; font-size:9.5px; border-width:1.5px; }
    .lrow .lb { font-size:11.5px; }

    /* --- 하단 시트 --- */
    .panel { position:fixed; top:auto; left:0; right:0; bottom:0; width:auto; max-width:none;
      height:54vh; height:54dvh;
      border-radius:20px 20px 0 0; border-left:none; border-right:none; border-bottom:none;
      box-shadow:0 -8px 34px rgba(0,0,0,.6); transition:height .25s cubic-bezier(.2,.8,.3,1); }
    .panel.min { height:118px; }
    .panel.max { height:88vh; height:88dvh; }
    .grab { display:flex; align-items:center; justify-content:center; gap:8px;
      padding:9px 0 7px; flex-shrink:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .grab span { display:block; width:40px; height:4px; border-radius:3px; background:#3a4a68; }
    .grab em { font-style:normal; font-size:10.5px; color:#7f8ba1; }
    .grab:active span { background:#5b8def; }

    .panel-head { padding:2px 15px 0; }
    .p-day { font-size:11.5px; }
    .p-title { font-size:16.5px; }
    .p-sub { font-size:12px; margin-bottom:8px; }
    .panel.min .p-sub, .panel.min .p-meta, .panel.min .subtabs, .panel.min .panel-scroll { display:none; }
    .p-meta { margin-bottom:8px; }
    .chip { font-size:10.5px; }
    .stab { font-size:12px; padding:11px 2px; }
    .panel-scroll { padding:14px 15px calc(env(safe-area-inset-bottom, 0px) + 24px); -webkit-overflow-scrolling:touch; }

    .card { padding:12px; gap:12px; }
    .card .ic { width:44px; height:44px; min-width:44px; }
    .card .nm { font-size:14.5px; }
    .route-btn { padding:11px 16px; font-size:13.5px; }
    .sumgrid { gap:6px; }
    .sumbox .v { font-size:16px; }
    .sect { margin:14px 0 7px; }

    /* --- 상세 레이어 : 바텀시트 --- */
    .modal { padding:0; align-items:flex-end; }
    .msheet { width:100%; max-width:none; max-height:88vh; border-radius:20px 20px 0 0;
      border-left:none; border-right:none; border-bottom:none;
      animation:slideup .24s cubic-bezier(.2,.9,.3,1); }
    .mhead { padding:16px 15px 13px; }
    .m-ic { width:48px; height:48px; min-width:48px; font-size:24px; border-radius:13px; }
    .m-title { font-size:18.5px; }
    .mclose { width:34px; height:34px; min-width:34px; font-size:15px; }
    .m-body { padding:15px; }
    .mds { font-size:13.5px; }
    .mfoot { padding:12px 13px calc(env(safe-area-inset-bottom, 0px) + 14px); gap:7px; }
    .mbtn { padding:13px 4px; font-size:11.5px; border-radius:12px; }

    .leaflet-control-zoom { display:none; }
    .mk-label { font-size:10.5px; padding:1px 6px; }
    .mk-label.tiny { font-size:9.5px; }
  }

  /* 화면이 낮을 때(가로 모드 등) 시트를 더 낮게 */
  @media (max-width:1px) and (max-height:520px) {
    .panel { height:62vh; }
    .panel.min { height:104px; }
    .panel.max { height:92vh; }
    .brand { display:none; }
  }

  @media (max-width:1px) {
    .tab { padding:6px 11px; font-size:12.5px; }
    .tab small { font-size:9px; }
    .stab { font-size:10.5px; }
    .mbtn { font-size:10.5px; padding:12px 3px; }
    .brand b { font-size:12.5px; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="topbar">
  <div class="brand"><b>포항 → 속초 4박5일 동해안 드라이브</b><i> 2026.11.2(월)~11.6(금) · 경기 광주 출발/도착 · 총 약 980km</i></div>
  <div class="tabs" id="tabs"></div>
  <div class="layers">
    <h4>지도에 표시</h4>
    <div id="layerRows"></div>
    <div class="ldiv"></div>
    <div class="ldays" id="legendDays"></div>
  </div>
</div>
<div class="panel" id="panelBox">
  <div class="grab" id="grab"><span></span><em id="grabTxt">탭하면 넓게 보기</em></div>
  <div class="panel-head">
    <div class="p-day" id="pday"></div>
    <div class="p-title" id="ptitle"></div>
    <div class="p-sub" id="psub"></div>
    <div class="p-meta" id="pmeta"></div>

/* ===================================================================
   동해안 해안선 경로 (남→북) — 코스 간 이동선을 해안도로 모양으로 그리기
   =================================================================== */
const COAST = [
 [35.9910,129.5560],[36.0180,129.5730],[36.0560,129.5760],[36.0760,129.5665],
 [36.0870,129.5300],[36.0700,129.4950],[36.0450,129.4600],[36.0330,129.4230],
 [36.0290,129.3930],[36.0400,129.3720],[36.0570,129.3785],[36.0900,129.4000],

 [36.3592,129.3856],[36.3900,129.4180],[36.4245,129.4363],[36.4600,129.4470],
 [36.5200,129.4400],[36.5800,129.4300],[36.6300,129.4400],[36.6774,129.4529],
 [36.7600,129.4700],[36.8200,129.4600],[36.8800,129.4400],[36.9297,129.4165],
 [36.9900,129.4000],[37.0533,129.4222],[37.1200,129.3900],[37.1900,129.3600],
 [37.2500,129.3400],[37.2867,129.3196],[37.3400,129.2800],[37.4000,129.2400],
 [37.4400,129.1900],[37.4467,129.1811],[37.4756,129.1610],[37.5100,129.1400],
 [37.5524,129.1188],[37.6000,129.0900],[37.6300,129.0700],[37.6595,129.0509],
 [37.6900,129.0400],[37.7400,128.9800],[37.7716,128.9470],[37.7950,128.9200],
 [37.8300,128.8900],[37.8798,128.8290],[37.9030,128.8290],[37.9500,128.7800],
 [37.9900,128.7600],[38.0221,128.7266],[38.0462,128.7113],[38.0800,128.6700],
 [38.1249,128.6301],[38.1600,128.6050],[38.1906,128.6009],[38.2071,128.5919],
 [38.2115,128.5980]
];
const km = (a,b) => Math.hypot((a[0]-b[0])*111, (a[1]-b[1])*88.5);
function nearCoast(pt){                       // 해안선에서 가장 가까운 인덱스·거리
  let bi=-1, bd=1e9;
  COAST.forEach((c,i)=>{ const d=km(c,pt); if(d<bd){bd=d;bi=i;} });
  return {i:bi, d:bd};
}
/* 두 지점 사이를 해안도로 모양으로 잇는 좌표 배열 */
function coastalPath(a, b){
  const A = nearCoast(a), B = nearCoast(b);
  const TH = 5;                               // 해안에서 5km 이내여야 해안선 스냅(내륙 명소는 직선)
  if(A.d > TH || B.d > TH || A.i === B.i) return [a, b];
  const step = A.i < B.i ? 1 : -1;
  const mid = [];
  for(let i = A.i + step; i !== B.i + step; i += step) mid.push(COAST[i]);
  return [a, ...mid, b];
}
/* 하루치 코스를 해안 우선 경로로 변환 (출발 지점 포함) */
function routeLine(day){
  const pts = day.stops.filter(s=>!s.sect).map(s=>s.coord);
  let out = [pts[0]];
  for(let i=1;i<pts.length;i++) out = out.concat(coastalPath(pts[i-1], pts[i]).slice(1));
  return out;
}

/* ================= 지도 (오프라인이면 목록 전용 모드) ================= */

const CAT = {
  course:{ label:'코스',   color:'#5b8def', icon:'📍' },
  photo :{ label:'포토존', color:'#f19bff', icon:'📸' },
  food  :{ label:'맛집',   color:'#ffd166', icon:'🍽' },
  drone :{ label:'드론',   color:'#5fe0c0', icon:'🚁' },
  stay  :{ label:'숙박',   color:'#ff8fa3', icon:'🏨' }
};
/* 지도 레이어 on/off (기본: 포토존·드론·숙박 켜짐) */
const SHOW = { photo:true, food:false, drone:true, stay:true };

let curDay = 0;              // -1 = 전체 경로 보기
let curCat = 'course';

function courseStops(day){ return day.stops.filter(s=>!s.sect && !s.skip); }
function gmapsLink(day){
  return 'https://www.google.com/maps/dir/' + courseStops(day).map(s=>s.coord[0]+','+s.coord[1]).join('/');
}
function gmapsAll(){
  const pts = [];
  DAYS.forEach(d=>courseStops(d).forEach(s=>pts.push(s)));
  // 구글맵 경유지 제한(약 10개) — 일차별 대표 지점만 추림
  const key = [pts[0], ...DAYS.map(d=>{const c=courseStops(d); return c[Math.floor(c.length/2)];}), pts[pts.length-1]];
  return 'https://www.google.com/maps/dir/' + key.map(s=>s.coord[0]+','+s.coord[1]).join('/');
}
function naverSearch(name){ return 'https://map.naver.com/p/search/' + encodeURIComponent(name); }

function pinIcon(cat, small){
  const c = CAT[cat];
  return L.divIcon({ className:'',
    html:`<div class="pin${small?' sm':''}" style="background:${c.color}"><b>${c.icon}</b></div>`,
    iconSize: small?[22,22]:[27,27], iconAnchor: small?[11,22]:[13,27] });
}

/* POI(포토존·맛집·드론·숙박) 아이콘을 지도에 뿌리기 */
function addPois(day, dayIdx, small){
  const out = [];
  ['photo','food','drone','stay'].forEach(cat=>{
    if(!SHOW[cat]) return;
    (day[cat]||[]).forEach((p,idx)=>{
      const m = L.marker(p.coord, {icon:pinIcon(cat, small), zIndexOffset: cat===curCat?600:200}).addTo(layerGroup);
      m.bindTooltip(`${CAT[cat].icon} ${p.name}`, {direction:'top', offset:[0,-24],
        className:'mk-label tiny', permanent: (!small && cat===curCat)});
      m.on('click', ()=>{
        if(curDay !== dayIdx || curCat !== cat){ curDay = dayIdx; curCat = cat; render(); }
        setTimeout(()=>{ focusCard(idx); openDetail(cat, dayIdx, idx); }, 60);
      });
      out.push(p.coord);
    });
  });
  return out;
}

/* ---- 마커 그리기 ---- */
function drawMarkers(){
  if(!HAS_MAP) return;
  layerGroup.clearLayers();

  /* ===== 전체 경로 보기 ===== */
  if(curDay === -1){
    const all = [];
    DAYS.forEach((day,di)=>{
      const cs = courseStops(day);
      L.polyline(routeLine(day), { color:day.color, weight:4, opacity:.9, lineJoin:'round' }).addTo(layerGroup);
      cs.forEach((s,idx)=>{
        const first = idx===0, last = idx===cs.length-1;
        const icon = L.divIcon({ className:'',
          html:`<div class="mk${first||last?'':' dot'}" style="background:${day.color}">${first||last?(di+1):''}</div>`,
          iconSize:(first||last)?[28,28]:[13,13], iconAnchor:(first||last)?[14,14]:[6,6] });
        const m = L.marker(s.coord, {icon, zIndexOffset:(first||last)?500:100}).addTo(layerGroup);
        m.bindTooltip(`${di+1}일차 · ${s.name}`, {direction:'top', offset:[0,-14], className:'mk-label tiny'});
        m.on('click', ()=>{ curDay = di; curCat='course'; render(); });
      });
      routeLine(day).forEach(c=>all.push(c));
      addPois(day, di, true).forEach(c=>all.push(c));
    });
    fit(all);
    return;
  }

  /* ===== 일차별 보기 ===== */
  const day = DAYS[curDay];
  const cs = courseStops(day);
  L.polyline(routeLine(day), { color:day.color, weight:3.5, opacity: curCat==='course'?.9:.4, lineJoin:'round' }).addTo(layerGroup);

  // 출발지 등 번호 없는 지점(고속도로 경유 표시)도 작은 표식으로
  day.stops.filter(s=>!s.sect && s.skip).forEach(s=>{
    const icon = L.divIcon({ className:'',
      html:`<div class="mk dot" style="background:#0e1420;border-color:${day.color}"></div>`, iconSize:[13,13], iconAnchor:[6,6] });
    L.marker(s.coord, {icon}).addTo(layerGroup)
      .bindTooltip(`${s.t} ${s.name}`, {direction:'top', offset:[0,-9], className:'mk-label tiny'});
  });

  cs.forEach((s,idx)=>{
    const isC = curCat === 'course';
    const inl = s.badge==='inland' ? ' inland-mk' : '';
    const icon = L.divIcon({ className:'',
      html:`<div class="mk${inl}${isC?'':' dot'}" style="background:${day.color};${isC?'':'opacity:.55'}">${isC?(idx+1):''}</div>`,
      iconSize:isC?[28,28]:[13,13], iconAnchor:isC?[14,14]:[6,6] });
    const m = L.marker(s.coord, {icon, zIndexOffset:isC?500:100}).addTo(layerGroup);
    m.bindTooltip(`${idx+1}. ${s.name}`, {permanent:isC, direction:'top', offset:[0,isC?-15:-9], className:isC?'mk-label':'mk-label tiny'});
    m.on('click', ()=>{
      if(curCat!=='course'){ curCat='course'; render(); }
      setTimeout(()=>{ focusCard(idx); openDetail('course', curDay, idx); }, 60);
    });
  });

  const poi = addPois(day, curDay, false);
  fit(routeLine(day).concat(poi));
}
/* 패널을 피해서 지도를 맞춤 (모바일 = 아래쪽, 데스크톱 = 오른쪽) */
function fit(coords){
  if(!HAS_MAP || !coords.length) return;
  const b = L.latLngBounds(coords);
  const mob = window.innerWidth <= 900;
  let opt;
  if(mob){
    const top = (document.querySelector('.topbar')||{}).offsetHeight || 130;
    const bot = (document.getElementById('panelBox')||{}).offsetHeight || 300;
    opt = { paddingTopLeft:[22, top + 14], paddingBottomRight:[22, bot + 14] };
  } else {
    opt = { paddingTopLeft:[40, 120], paddingBottomRight:[460, 40] };
  }
  try{ map.fitBounds(b, opt); }catch(e){ try{ map.fitBounds(b); }catch(e2){} }
}
function focusCard(idx){
  const el = document.getElementById('card-'+idx);
  if(!el) return;
  el.scrollIntoView({behavior:'smooth', block:'center'});
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('hl'));
  el.classList.add('hl');
}

  must:'<span class="badge b-must">필수</span>', food:'<span class="badge b-food">맛집</span>',
  inland:'<span class="badge b-inland">내륙 명소</span>', night:'<span class="badge b-night">야경</span>',

/* ---- 전체 경로 패널 ---- */
function renderOverview(){
  const n = k => DAYS.reduce((a,d)=>a+(d[k]||[]).length, 0);
  let html = `<a class="route-btn" href="${gmapsAll()}" target="_blank">➤&nbsp;구글맵으로 전체 여정 열기</a>
  <div class="sumgrid">
    <div class="sumbox"><div class="v" style="color:#f19bff">${n('photo')}</div><div class="k">📸 포토존</div></div>
    <div class="sumbox"><div class="v" style="color:#ffd166">${n('food')}</div><div class="k">🍽 맛집</div></div>
    <div class="sumbox"><div class="v" style="color:#5fe0c0">${n('drone')}</div><div class="k">🚁 드론</div></div>
    <div class="sumbox"><div class="v" style="color:#ff8fa3">${n('stay')}</div><div class="k">🏨 숙박</div></div>
  </div>
  <div class="sect">일차별 요약 · 클릭하면 상세로 이동</div>`;

  DAYS.forEach((d,i)=>{
    const cs = courseStops(d);
    const head = cs[0].name, tail = cs[cs.length-1].name;
    html += `<div class="daycard" data-day="${i}" style="border-left-color:${d.color}">
      <div>
        <div class="dn"><b style="color:${d.color}">${i+1}일차</b> · ${d.date} · ${(d.meta||[])[0]||''}</div>
        <div class="dt">${d.title}</div>
        <div class="dm">📍 ${head} → ${tail} · 코스 ${cs.length}곳<br>
          📸 ${(d.photo||[]).length} · 🍽 ${(d.food||[]).length} · 🚁 ${(d.drone||[]).length} · 🏨 ${(d.stay||[]).length||'—'}</div>
        <div class="go">${i+1}일차 상세 보기 →</div>
      </div></div>`;
  });

  html += `<div class="stay-note">🗺 지도의 색이 곧 일차입니다. 큰 원은 각 일차의 <b>출발·도착 지점</b>, 작은 점은 경유지예요.
  <b>2~4일차는 코스와 코스 사이를 실제 해안도로 선형에 맞춰</b> 그려서 동해안을 따라 달리는 모양 그대로 보입니다.
  왼쪽 아래 <b>'지도에 표시'</b>에서 포토존·맛집·드론·숙박 아이콘을 켜고 끌 수 있어요.</div>
  <div class="drivebar">🚗 <b>총 주행 약 980km</b> · 4박 5일 · 경기 광주 출발/도착<br>
  1일차 430km(문경 경유 이동일) → 2일차 190km → 3일차 200km → 4일차 90km → 5일차 260km(귀가일).
  중간 사흘이 가벼워 실제 체감은 편안한 편입니다.</div>`;

  document.getElementById('panel').innerHTML = html;
  document.getElementById('panel').scrollTop = 0;
  document.querySelectorAll('.daycard').forEach(el=>{
    el.addEventListener('click', ()=>{ curDay = +el.dataset.day; curCat = 'course'; render(); });
  });
}

function renderPanel(){
  if(curDay === -1){ renderOverview(); return; }
  const day = DAYS[curDay];
  let html = '';

  if(curCat === 'course'){
    html += `<a class="route-btn" href="${gmapsLink(day)}" target="_blank">➤&nbsp;구글맵으로 전체 경로 열기</a>`;
    let mk = 0;
    day.stops.forEach(s=>{
      if(s.sect){ html += `<div class="sect">${s.sect}</div>`; return; }
      const isMk = !s.skip;
      const num = isMk ? `<span class="num" style="background:${day.color}">${mk+1}</span>` : '';
      const id  = isMk ? `id="card-${mk}" data-mk="${mk}"` : '';
      html += `<div class="card${s.road?' roadcard':''}" ${id}>
        <div class="ic">${s.ic}</div>
        <div><div class="t">${s.t}</div>
        <div class="nm">${num}${s.name}${s.badge?BADGES[s.badge]:''}</div>
        <div class="ds">${s.ds}</div></div></div>`;
      if(isMk) mk++;
    });
    if(day.tip) html += `<div class="drivebar">${day.tip}</div>`;
  }
  else {
    const list = day[curCat] || [];
    const c = CAT[curCat];
    if(curCat === 'drone' && day.droneWarn) html += `<div class="warn">${day.droneWarn}</div>`;
    if(curCat === 'stay' && !list.length){
      html += `<div class="drivebar">마지막 날은 귀가하는 일정이라 숙박이 없습니다. 대신 4일차 속초 숙소에서 체크아웃 후 바로 설악산으로 이동하세요.</div>`;
    }
    list.forEach((p,idx)=>{
      const tags = (p.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('');
      html += `<div class="card" id="card-${idx}" data-mk="${idx}">
        <div class="ic" style="background:${c.color}22;color:${c.color}">${p.ic}</div>
        <div style="min-width:0">
          <div class="t">${c.label} ${idx+1}</div>
          <div class="nm">${p.name}</div>
          <div class="ds">${p.ds}</div>
          ${p.ad?`<div class="ad">📍 ${p.ad}</div>`:''}
          ${tags?`<div>${tags}</div>`:''}
          <div style="margin-top:7px;font-size:11.5px;color:#6ec6ff">자세히 보기 →</div>
        </div></div>`;
    });
    if(curCat === 'stay' && list.length){
      html += `<div class="stay-note">🅿️ 세 곳 모두 <b>객실 앞 또는 건물 부설 주차</b>가 되는 드라이브인 구조로 골랐습니다. 짐 많은 드라이브 여행엔 주차 동선이 곧 편의예요. 11월 초는 비수기라 당일 예약도 가능하지만, 오션뷰 지정은 미리 전화로 요청하는 게 확실합니다.</div>`;
    }
    if(curCat === 'food'){
      html += `<div class="stay-note">🍽 <b>11월 초 제철</b> — 대게(11/1 금어기 해제·첫물), 홍게, 곰치국(물곰탕), 도루묵, 양미리. 영덕·울진 구간에서 대게를 한 번 제대로 드시고, 나머지는 물회·순두부·닭강정으로 가볍게 가는 배분을 추천합니다.</div>`;
    }
  }

  document.getElementById('panel').innerHTML = html;
  document.getElementById('panel').scrollTop = 0;

  document.querySelectorAll('.card[data-mk]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const i = +el.dataset.mk;
      document.querySelectorAll('.card').forEach(x=>x.classList.remove('hl'));
      el.classList.add('hl');
      openDetail(curCat, curDay, i);
    });
  });
}

function renderHead(){
  const st = document.getElementById('subtabs');
  if(curDay === -1){
    document.getElementById('pday').textContent   = '전체 일정';
    document.getElementById('ptitle').textContent = '포항 → 속초 4박5일 동해안 드라이브';
    document.getElementById('psub').textContent   = '5일치 경로를 색상별로 한눈에. 지도의 선·원 색이 각 일차이고, 아이콘은 포토존·맛집·드론촬영지·숙박입니다.';
    document.getElementById('pmeta').innerHTML    = ['📅 2026.11.2~11.6','🚗 총 950km','🏁 경기 광주 출발/도착'].map(m=>`<span class="chip">${m}</span>`).join('');
    st.style.display = 'none';
    return;
  }
  st.style.display = 'flex';
  const day = DAYS[curDay];
  document.getElementById('pday').textContent   = `${curDay+1}일차 · ${day.date}`;
  document.getElementById('ptitle').textContent = day.title;
  document.getElementById('psub').textContent   = day.sub;
  document.getElementById('pmeta').innerHTML    = (day.meta||[]).map(m=>`<span class="chip">${m}</span>`).join('');
}

function render(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', +t.dataset.d === curDay));
  document.querySelectorAll('.stab').forEach(t=>t.classList.toggle('on', t.dataset.cat===curCat));
  renderHead(); renderPanel(); drawMarkers(); renderLayerBox();
}

/* ================= 모바일 하단 시트 ================= */
const PANEL = document.getElementById('panelBox');
const SHEET = ['min','mid','max'];
const SHEET_TXT = ['탭하면 일정 열기', '탭하면 넓게 보기', '탭하면 지도 보기'];
let sheetIdx = 1;                                   // 기본 = 중간 높이
function isMobileView(){ return false; }
function applySheet(){
  PANEL.classList.remove('min','max');
  if(SHEET[sheetIdx] !== 'mid') PANEL.classList.add(SHEET[sheetIdx]);
  const t = document.getElementById('grabTxt'); if(t) t.textContent = SHEET_TXT[sheetIdx];
  setTimeout(()=>{ map.invalidateSize(); }, 290);
}
document.getElementById('grab').addEventListener('click', ()=>{
  sheetIdx = (sheetIdx + 1) % 3; applySheet();
});
/* 손잡이 위아래로 끌어서 조절 */
(function(){
  const g = document.getElementById('grab');
  let y0 = null;
  g.addEventListener('touchstart', e=>{ y0 = e.touches[0].clientY; }, {passive:true});
  g.addEventListener('touchmove', e=>{
    if(y0 === null) return;
    const dy = e.touches[0].clientY - y0;
    if(Math.abs(dy) < 32) return;
    sheetIdx = Math.max(0, Math.min(2, sheetIdx + (dy > 0 ? -1 : 1)));
    y0 = null; applySheet();
  }, {passive:true});
  g.addEventListener('touchend', ()=>{ y0 = null; }, {passive:true});
})();
/* 지도를 탭하면 시트를 줄여 지도를 넓게 */
map.on('click', ()=>{ if(isMobileView() && sheetIdx > 0){ sheetIdx = 0; applySheet(); } });
PANEL.addEventListener('transitionend', e=>{ if(e.propertyName === 'height') map.invalidateSize(); });
let rzT;
window.addEventListener('resize', ()=>{ clearTimeout(rzT); rzT = setTimeout(()=>{ map.invalidateSize(); render(); }, 220); });
window.addEventListener('orientationchange', ()=>{ setTimeout(()=>{ map.invalidateSize(); render(); }, 400); });
applySheet();

const IS_MOBILE = /android|iphone|ipad|ipod/i.test(navigator.userAgent);
(function loadKakaoSdk(){
  if(!KAKAO_JS_KEY) return;
  const s = document.createElement('script');
  s.src = 'https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js';
  s.onload = ()=>{ try{ window.Kakao.init(KAKAO_JS_KEY); }catch(e){} };
  document.head.appendChild(s);
})();

function startKakaoNavi(name, lat, lng){
  // ① 공식 SDK (JavaScript 키가 있을 때) — 카카오내비 앱을 목적지까지 바로 실행
  if(KAKAO_JS_KEY && window.Kakao && window.Kakao.Navi){
    try{ window.Kakao.Navi.start({ name, x:lng, y:lat, coordType:'wgs84' }); return; }catch(e){}
  }
  // ② 키가 없을 때 — 모바일이면 앱 스킴을 순차 시도
  const webFallback = `https://map.kakao.com/link/to/${encodeURIComponent(name)},${lat},${lng}`;
  if(!IS_MOBILE){ window.open(webFallback, '_blank'); return; }

  let left = false;
  const onHide = ()=>{ if(document.hidden) left = true; };
  document.addEventListener('visibilitychange', onHide);

  // 카카오내비 앱 → 실패하면 카카오맵 내비 → 그래도 안 되면 웹
  location.href = `kakaonavi://navigate?name=${encodeURIComponent(name)}&x=${lng}&y=${lat}&coord_type=wgs84`;
  setTimeout(()=>{ if(!left) location.href = `kakaomap://startnavi?type=safedrive&ep=${lat},${lng}`; }, 900);
  setTimeout(()=>{ document.removeEventListener('visibilitychange', onHide);
                   if(!left) location.href = webFallback; }, 2200);
}

const MODAL = document.getElementById('modal');
function openDetail(cat, dayIdx, idx){
  const day = DAYS[dayIdx];
  let p, kind, extra = '';

  if(cat === 'course'){
    p = courseStops(day)[idx]; kind = '코스';
    extra = `<div class="mrow"><span class="mk2">시간</span><span>${p.t}</span></div>`;
  } else {
    p = (day[cat]||[])[idx]; kind = CAT[cat].label;
    if(p.ad) extra += `<div class="mrow"><span class="mk2">주소</span><span>${p.ad}</span></div>`;
  }
  if(!p) return;

  const c = CAT[cat];
  const near = nearestStop(day, p.coord);
  const tags = (p.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('');

  let body = `<figure class="m-photo" aria-label="${escapeHtml(p.name)} 대표 사진">
    <img alt="${escapeHtml(p.name)} 대표 사진" decoding="async">
    <div class="m-photo-status">🖼️ 대표 사진을 불러오는 중…</div>
    <figcaption class="m-photo-credit"></figcaption>
  </figure><div class="mds">${p.ds}</div>`;
  if(tags) body += `<div style="margin-top:8px">${tags}</div>`;

  body += `<div class="mtable">
    <div class="mrow"><span class="mk2">일차</span><span style="color:${day.color};font-weight:bold">${dayIdx+1}일차 · ${day.date}</span></div>
    ${extra}
    <div class="mrow"><span class="mk2">동선</span><span>${near}</span></div>
    <div class="mrow"><span class="mk2">좌표</span><span>${p.coord[0].toFixed(4)}, ${p.coord[1].toFixed(4)}</span></div>
  </div>
  <div style="font-size:11.5px;color:#7f8ba1;margin-top:9px;line-height:1.55">
    🚘 휴대폰에서 <b>카카오내비 길안내</b>를 누르면 카카오내비 앱이 이 좌표를 목적지로 바로 실행합니다.
    ${KAKAO_JS_KEY ? '' : 'PC에서는 카카오맵 웹으로 열립니다.'}
  </div>`;

  if(cat === 'drone'){
    body += `<div class="warn" style="margin:12px 0 0">${day.droneWarn||'비행 전 드론원스톱에서 공역을 확인하세요.'}</div>
    <div class="mnote">🚁 <b>촬영 체크리스트</b> — ① 250g 초과 기체는 기체신고·조종자 준수사항 필수 ② 일몰 후 야간비행 금지(별도 특별비행승인 필요) ③ 고도 150m 이하 ④ 사람·차량 직상공 회피 ⑤ 해안은 바람이 강하니 배터리 30% 여유.</div>`;
  }
  if(cat === 'stay'){
    body += `<div class="mnote">🅿️ 객실 앞 또는 건물 부설 주차가 되는 <b>드라이브인 구조</b>로 선별했습니다. 오션뷰 객실은 예약 시 전화로 지정 요청하는 게 확실해요. 11월 초는 비수기라 요금·객실 여유가 있는 편입니다.</div>`;
  }
  if(cat === 'photo'){
    body += `<div class="mnote">📸 <b>촬영 팁</b> — 11월 초 동해안 일출 07:00 / 일몰 17:20 기준. 해가 낮게 깔려 오전·오후 모두 골든아워가 길게 유지됩니다.</div>`;
  }
  if(cat === 'food'){
    body += `<div class="mnote">🍽 <b>11월 초 제철</b> — 대게(11/1 금어기 해제 첫물), 홍게, 곰치국, 도루묵, 양미리. 대게는 영덕·울진에서 한 번 제대로 드시는 걸 권합니다.</div>`;
  }

  MODAL.querySelector('.m-ic').style.background = c.color + '22';
  MODAL.querySelector('.m-ic').style.color = c.color;
  MODAL.querySelector('.m-ic').textContent = p.ic || c.icon;
  MODAL.querySelector('.m-kind').innerHTML = `<span style="color:${c.color}">${c.icon} ${kind}</span> · ${dayIdx+1}일차`;
  MODAL.querySelector('.m-title').textContent = p.name;
  MODAL.querySelector('.m-body').innerHTML = body;
  loadRepresentativePhoto(p, day, cat);
  MODAL.querySelector('.m-nav').href  = naverSearch(p.name);
  MODAL.querySelector('.m-gmap').href = `https://www.google.com/maps/search/?api=1&query=${p.coord[0]},${p.coord[1]}`;
  MODAL.querySelector('.m-navi').onclick = ()=>startKakaoNavi(p.name, p.coord[0], p.coord[1]);
  MODAL.classList.add('open');
  if(HAS_MAP) map.flyTo(p.coord, 15, {duration:.7});
}

  ['강릉 안목해변',37.7716,128.9470],['강릉 경포대',37.7790,128.8780],['강릉 초당동',37.7905,128.9155],
  ['강릉 주문진',37.8910,128.8290],['양양 남애항',37.9500,128.7800],['양양 서피비치',38.0462,128.7113],
  ['양양 하조대',38.0221,128.7266],['양양 낙산사',38.1249,128.6301],['속초',38.2047,128.5902],
  ['속초 영랑호',38.2143,128.5745],['설악산',38.1735,128.4870],['미시령',38.2166,128.4258]
].map(([label,lat,lng])=>({label,lat,lng}));
function nearestPhotoArea(coord){
  if(!coord) return {label:'동해안'};
  return PHOTO_AREAS.reduce((best,a)=>{
    const d=Math.hypot((a.lat-coord[0])*111,(a.lng-coord[1])*88);
    return !best||d<best.d?{...a,d}:best;
  },null);
}
function placePhoto(name,coord){
  const area=nearestPhotoArea(coord).label;
  const base=String(name||'').replace(/\((점심|저녁|아침|포장|체크인|이른 아침)[^)]*\)/g,'').trim();
  const query=`${base} ${area} 실제 장소 사진`;
  const encoded=encodeURIComponent(query);
  return {
    url:`https://tse2.mm.bing.net/th?q=${encoded}&w=1200&h=675&c=7&rs=1&p=0`,
    search:`https://www.bing.com/images/search?q=${encoded}`, area
  };
}
function loadRepresentativePhoto(p){
  ++photoRequestToken;
  const figure = MODAL.querySelector('.m-photo');
  const img = figure&&figure.querySelector('img');
  const credit = figure&&figure.querySelector('.m-photo-credit');
  if(!figure||!img||!credit) return;
  const meta = placePhoto(p.name,p.coord);
  img.onload = ()=>figure.classList.add('ready');
  img.onerror = ()=>{ figure.querySelector('.m-photo-status').textContent='🖼️ 대표 사진을 불러오지 못했습니다.'; };
  img.src = meta.url;
  credit.innerHTML = `<a href="${meta.search}" target="_blank" rel="noopener">${escapeHtml(p.name)} 대표 사진</a> · ${escapeHtml(meta.area)}`;
}
function nearestStop(day, coord){
  const cs = courseStops(day);
  let best = null, bd = 1e9;
  cs.forEach((s,i)=>{
    const d = Math.hypot((s.coord[0]-coord[0])*111, (s.coord[1]-coord[1])*88);
    if(d < bd){ bd = d; best = {s,i}; }
  });
  if(!best) return '-';
  return bd < 0.4 ? `코스 ${best.i+1}번 「${best.s.name}」 바로 옆`
       : `코스 ${best.i+1}번 「${best.s.name}」에서 약 ${bd.toFixed(1)}km`;
}
function closeDetail(){ photoRequestToken++; MODAL.classList.remove('open'); }
MODAL.addEventListener('click', e=>{ if(e.target === MODAL) closeDetail(); });
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeDetail(); });
/* 모바일: 시트를 아래로 쓸어내리면 닫기 */
(function(){
  const s = MODAL.querySelector('.mhead'); let y0 = null;
  s.addEventListener('touchstart', e=>{ y0 = e.touches[0].clientY; }, {passive:true});
  s.addEventListener('touchmove', e=>{ if(y0!==null && e.touches[0].clientY - y0 > 60){ y0=null; closeDetail(); } }, {passive:true});
  s.addEventListener('touchend', ()=>{ y0 = null; }, {passive:true});
})();

render();
setTimeout(()=>{ map.invalidateSize(); render(); }, 200);
</script>
